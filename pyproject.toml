[project]
name = "rstp"
version = "0.1.0"
description = "Reflex Skill Tree Protocol — open, model-agnostic mistake-prevention for any AI agent"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []
authors = [{name = "Vektra Industries"}]

[project.scripts]
rstp = "rstp.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rstp*"]
