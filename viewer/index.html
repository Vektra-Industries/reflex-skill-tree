<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSTP Tree Viewer</title>
<style>
  :root {
    --seed: #6b7280; --novice: #60a5fa; --adept: #3b82f6;
    --expert: #a855f7; --master: #f59e0b; --bg: #0b0f1a; --ink: #e5e7eb;
    --locked: #374151;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #1f2937;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header input[type=file] { color: var(--ink); }
  header .stat { font-size: 12px; color: #9ca3af; }
  #empty {
    padding: 60px 20px; text-align: center; color: #9ca3af; font-size: 14px;
  }
  #canvas-wrap { overflow: auto; padding: 20px; }
  .branch-title { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .usage-level { font-size: 10px; fill: #9ca3af; }
  .node-box { stroke-width: 1.5; }
  .node-box.allocated { stroke: #fff; stroke-width: 2.5; }
  .node-title { font-size: 11px; fill: #0b0f1a; font-weight: 600; }
  .node-tier { font-size: 9px; fill: #0b0f1a; }
  .edge { stroke: #4b5563; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .edge-any { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow); }
  .legend { display: flex; gap: 10px; font-size: 11px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>RSTP Tree Viewer</h1>
  <input type="file" id="file" accept="application/json">
  <span class="stat" id="stats"></span>
  <div class="legend">
    <span><span class="swatch" style="background:var(--seed)"></span>Seed</span>
    <span><span class="swatch" style="background:var(--novice)"></span>Novice</span>
    <span><span class="swatch" style="background:var(--adept)"></span>Adept</span>
    <span><span class="swatch" style="background:var(--expert)"></span>Expert</span>
    <span><span class="swatch" style="background:var(--master)"></span>Master</span>
  </div>
</header>
<div id="empty">Open a tree.json file above to render it. Nothing leaves this
page — it's all parsed and drawn locally, no server, no network.</div>
<div id="canvas-wrap"></div>

<script src="app.js"></script>
<script>wireFileInput();</script>
</body>
</html>
