name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke-test the CLI
        run: |
          # examples/ file is a list wrapper (with provenance comments) for docs;
          # extract the inner node dict for the smoke test
          python3 - <<'PY'
          import json
          raw = json.load(open("examples/from-vektra-reflex.json"))[0]["node"]
          json.dump(raw, open("/tmp/node.json", "w"))
          PY
          python3 -m rstp seed /tmp/node.json --branch credential-ops --id cred-001 --tree /tmp/ci-tree.json
          python3 -m rstp status --tree /tmp/ci-tree.json
          python3 -m rstp status --tree /tmp/ci-tree.json --match "write_file /x/.env"
          python3 -m rstp log cred-001 prevented --session ci --tree /tmp/ci-tree.json
          python3 -m rstp check --tree /tmp/ci-tree.json
