name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke-test the CLI
        run: |
          python3 -m rstp seed examples/guitar.json --branch music --id guitar --tree /tmp/ci-tree.json
          python3 -m rstp seed examples/scales.json --branch music --id scales --tree /tmp/ci-tree.json
          python3 -m rstp status --tree /tmp/ci-tree.json
          python3 -m rstp practice guitar --session ci --tree /tmp/ci-tree.json
          python3 -m rstp practice guitar --session ci --tree /tmp/ci-tree.json
          python3 -m rstp practice scales --session ci --tree /tmp/ci-tree.json
          python3 -m rstp practice scales --session ci --tree /tmp/ci-tree.json
          python3 -m rstp allocate guitar --tree /tmp/ci-tree.json
          python3 -m rstp status --tree /tmp/ci-tree.json --verbose
          python3 -m rstp fuse music lead-guitar --title "Lead guitar improvisation" \
            --from guitar --from scales --tree /tmp/ci-tree.json
          python3 -m rstp status --tree /tmp/ci-tree.json --verbose
          python3 -m rstp report --tree /tmp/ci-tree.json
          python3 -m rstp report --tree /tmp/ci-tree.json --json
          python3 -m rstp check --tree /tmp/ci-tree.json
